name: Production operations
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-operations
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch notification batch and check operational health
        env:
          CRON_SECRET: ${{ secrets.MESSMATE_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://messmate-two.vercel.app/api/jobs/notifications
          curl --fail-with-body --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://messmate-two.vercel.app/api/jobs/monitor
          curl --fail-with-body --silent --show-error --max-time 20 https://messmate-two.vercel.app/api/ready
